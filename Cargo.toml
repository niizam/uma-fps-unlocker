[package]
name = "uma-fps-unlocker"
version = "0.1.0"
edition = "2021"

[lib]
name = "uma_unlocker"
crate-type = ["cdylib"]

[[bin]]
name = "uma_unlock_jp"
path = "src/jp.rs"

[[bin]]
name = "uma_unlock_global"
path = "src/global.rs"

[dependencies]
once_cell = "1"
widestring = "1"
minhook = "0.2"
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_Graphics_Gdi"
] }

[[bin]]
name = "uma_unlock_gui"
path = "src/gui.rs"

[build-dependencies]
winres = "0.1"
